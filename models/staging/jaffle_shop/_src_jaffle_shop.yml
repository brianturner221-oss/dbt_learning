sources:
  - name: jaffle_shop
    database: dbt-tutorial  
    schema: jaffle_shop 
    description: A clone of a Postgres application database.
    tables:
      - name: orders
        description: Raw orders data.
        columns:
          - name: id
            description: Primary Key for the order data.
            data_tests:
              - unique
              - not_null
        config: 
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at
      - name: customers
        description: Raw customers data.
        columns:
          - name: id
            description: Primary Key for the customer data.
            data_tests:
              - unique
              - not_null
               
